<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<title>DingCD</title>
<style>
:root{--ink:#f4f4ff;--tape:#ffe94a;--mag:#ff2e88;--cy:#29e0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:var(--ink);font-family:"Lucida Console","Courier New",monospace;font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.osd{letter-spacing:.08em;text-shadow:1.5px 0 var(--mag),-1.5px 0 var(--cy)}
body{position:fixed;inset:0;width:100%;overflow:clip}
#stage{position:absolute;left:0;top:0;width:1227px;height:1281px;transform-origin:0 0;background:#02030a}
#stage>*{position:absolute}
#room{left:0;top:0;width:1227px;height:1281px}
#screen{left:456px;top:431px;width:318px;height:236px;border-radius:46px;overflow:hidden;background:radial-gradient(120% 100% at 50% 40%,#1c2dff,#0006ee 60%,#00049a);box-shadow:inset 0 0 30px #000a}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#scr{position:absolute;inset:0;padding:26px 30px;display:flex;flex-direction:column;overflow:hidden;z-index:1}
#scr .c{margin:auto;text-align:center}.big{font-size:24px}
.nt{font-size:9.5px;margin:8px 0;color:var(--tape);text-shadow:1px 1px 0 #000}.nt.bad{color:#ff8a94}
.bl{font-size:13px;margin:0;animation:bl 1.2s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.hd{display:flex;align-items:center;gap:7px;font-size:10.5px;margin-bottom:5px;flex:none}
.bk{width:20px;height:20px;border:1px solid #fff;font-size:8px}
.ls{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
.mi{padding:6px 7px;border:1px solid rgba(255,255,255,.75);text-align:left;font-size:10.5px;background:rgba(0,0,0,.25)}
.rw{display:flex;gap:6px;align-items:center;border:1px solid rgba(255,255,255,.6);padding:3px;background:rgba(0,0,0,.25)}
.rw .th{width:46px;aspect-ratio:16/9;flex:none;background:#10124a center/cover}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;font-size:8px}.tx b{font-size:9.5px}
.tx span{opacity:.8;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv{font-size:13px;width:22px}.fv.on{color:var(--mag)}
.em{font-size:9.5px;font-weight:400;text-align:center;margin:14px 4px;line-height:1.5}.inf{font-size:10.5px;font-weight:400;line-height:1.6}
#q{width:100%;font:inherit;font-size:10.5px;padding:5px;margin-bottom:5px;border:0;outline:0;background:var(--ink);color:#000;user-select:text;-webkit-user-select:text}
#lab{left:446px;top:709px;width:208px;height:33px;display:flex;align-items:center;background:rgb(140,128,164);border-radius:3px;box-shadow:inset 0 1px 3px #0008}
#lab.shake{animation:shake .4s}@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#code{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:14px;letter-spacing:.12em;padding:0 8px;height:100%;color:#14102a;text-transform:uppercase;user-select:text;-webkit-user-select:text}
#code::placeholder{color:rgba(20,16,42,.6)}
#go{width:26px;height:100%;color:#14102a;font-size:13px}
.pb{top:705px;width:40px;height:40px;border-radius:10px}.pb:active{background:rgba(130,160,255,.4)}
#tw{left:539px;top:757px;width:150px;height:40px;overflow:hidden;pointer-events:none}
#tray{width:150px;height:30px;background:#1d1d24;border-radius:0 0 14px 14px;transform:translateY(-100%);transition:transform .8s cubic-bezier(.3,.7,.3,1);position:relative}
#tray.out{transform:none}
#disc{position:absolute;left:28px;top:4px;width:94px;height:22px;border-radius:50%;background:#cfd6ff center/cover;opacity:0;box-shadow:inset 0 0 0 2px #fff6}#disc.show{opacity:1}
#disc::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:5px;margin:-2.5px 0 0 -6px;border-radius:50%;background:#1d1d24}
#bk{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);perspective:1400px}#bk.on{display:flex}
#book{position:relative;width:300px;height:380px;transform:translateX(-75px) rotateX(8deg);transition:transform 1s;transform-style:preserve-3d}#book.open{transform:translateX(0) rotateX(8deg)}
.pgR,.leaf{position:absolute;right:0;top:0;width:150px;height:100%}
.pgR{background:#efe4c8;border-radius:0 8px 8px 0;padding:14px 10px;overflow:auto;color:#2b2418;box-shadow:6px 8px 0 #000}
.leaf{transform-origin:left center;transition:transform 1s;transform-style:preserve-3d}#book.open .leaf{transform:rotateY(-180deg)}
.fr,.bf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fr{background:linear-gradient(90deg,#2d0a24 0 8%,#a3123f 8%);border:3px solid #000;border-radius:0 8px 8px 0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.5}
.bf{transform:rotateY(180deg);background:#e6dab9;border-radius:8px 0 0 8px;padding:20px 14px;color:#2b2418;font-size:13px;line-height:1.6}.bf h3{margin:0 0 10px;font-size:17px}.bf p{font-weight:400;margin:0}
.cr{display:block;width:100%;text-align:left;padding:9px 2px;border-bottom:1px dashed #8a7c5a;font-size:11px}.cr i{display:block;font-style:normal;font-size:13px;color:#a3123f;letter-spacing:.12em}
#player{position:fixed;inset:0;z-index:60;background:#000;display:none}#player.on{display:block}
#ytw{position:absolute;inset:0}#ytw iframe{width:100%;height:100%;border:0}#tap{position:absolute;inset:0;z-index:2}
.bar{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px;transition:opacity .25s}
#pT{top:0;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}#pB{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
#player.hide .bar{opacity:0;pointer-events:none}
.sq{width:44px;height:44px;border:2px solid var(--ink);border-radius:6px;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
#pTitle{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{flex:1;accent-color:var(--cy);height:30px}#tm{font-size:12px;min-width:92px;text-align:right;color:var(--tape)}
#end,#perr{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.9);text-align:center;padding:24px}
#end.on,#perr.on{display:flex}#end h2{margin:0;font-size:34px}.btns{display:flex;gap:12px}
.pbtn{padding:12px 22px;background:var(--ink);color:#000;border:3px solid #000;box-shadow:4px 4px 0 var(--mag);font-size:15px}
</style></head><body>
<div id="stage">
 <img id="room" src="room.jpg" alt="">
 <div id="screen"><div id="scr"></div></div>
 <div id="tw"><div id="tray"><div id="disc"></div></div></div>
 <div id="lab"><input id="code" type="text" placeholder="CODE" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Disc code"><button id="go" aria-label="Insert disc">&#9654;</button></div>
 <button class="pb" id="bGear" style="left:661px" aria-label="Settings"></button>
 <button class="pb" id="bInfo" style="left:704px" aria-label="Info"></button>
 <button class="pb" id="bFilm" style="left:747px" aria-label="Code Book"></button>
</div>
<section id="bk"><div id="book"><div class="pgR" id="pg"></div><div class="leaf"><div class="fr osd">CODE<br>BOOK</div><div class="bf"><h3>Code Book</h3><p>Tap a code to put it on the player.</p></div></div></div></section>
<section id="player">
 <div id="ytw"><div id="yt"></div></div><div id="tap"></div>
 <div class="bar" id="pT"><button class="sq" id="pBack" aria-label="Back">&#9664;</button><div id="pTitle" class="osd"></div><button class="sq" id="pFav" aria-label="Favorite">&#9829;</button></div>
 <div class="bar" id="pB"><button class="sq" id="pPlay" aria-label="Play or pause">&#10074;&#10074;</button><input id="seek" type="range" min="0" max="1000" value="0"><div id="tm">0:00 / 0:00</div></div>
 <div id="end"><h2 class="osd">THE END</h2><div class="btns"><button class="pbtn" id="eRep">Replay</button><button class="pbtn" id="eBack">Back</button></div></div>
 <div id="perr"><div id="perrT"></div><button class="pbtn" id="eBack2">Back</button></div>
</section>
<script>
/* ===== YOUR MOVIES - edit here (id, title, desc, yt = YouTube video ID, code, secret true/false, optional thumb link) ===== */
const MOVIES=[
 {id:'bunny',title:'Big Buck Bunny',desc:'A giant rabbit gets even with three bullying rodents. Placeholder movie for testing.',yt:'aqz-KE-bpKQ',code:'BUNNY',secret:false},
 {id:'sintel',title:'Sintel',desc:'A young woman searches for the dragon she once raised. Placeholder movie for testing.',yt:'eRsGyueVLvQ',code:'SINTEL',secret:false},
 {id:'steel',title:'Tears of Steel',desc:'Warriors and scientists try to save the world from robots. Placeholder movie for testing.',yt:'R6MlUcmOul8',code:'STEEL',secret:false},
 {id:'hush',title:'Secret Test Disc',desc:'A secret disc. Watch once, then it is gone.',yt:'aqz-KE-bpKQ',code:'HUSH',secret:true}
];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb=m=>m.thumb||'https://img.youtube.com/vi/'+m.yt+'/hqdefault.jpg',norm=s=>String(s).toUpperCase().replace(/\s+/g,'');
const ld=k=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[]}catch(e){return[]}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const S={un:ld('dc_unlocked'),fv:ld('dc_favs'),rc:ld('dc_recent'),snd:(()=>{try{return localStorage.getItem('dc_sound')!=='0'}catch(e){return true}})()};
const byId=id=>MOVIES.find(m=>m.id===id),orient=m=>{try{window.Android&&Android.orient(m)}catch(e){}};
let view='home',lm='movies',note='',bad=false,busy=false,arm=false,cur=null,player=null,poll=null,hideT=null,drag=false,ytS=0,sfx=null;const ytq=[];
fetch('cd.mp3').then(r=>r.blob()).then(b=>{sfx=URL.createObjectURL(b)}).catch(()=>{});
/* ---- fit the room to the phone ---- */
const stage=$('#stage');
function layout(){if(busy)return;const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight,
 s=Math.max(w/1227,h/1281,w/600),l=Math.min(0,Math.max(w-1227*s,w/2-614*s)),t=Math.min(0,Math.max(h-1281*s,h/2-570*s));
 stage.style.transition='none';stage.style.transform='translate('+l+'px,'+t+'px) scale('+s+')';
 const r=stage.getBoundingClientRect(),dx=l-(r.left-(vv?vv.offsetLeft:0)),dy=t-(r.top-(vv?vv.offsetTop:0));
 if(Math.abs(dx)>1||Math.abs(dy)>1)stage.style.transform='translate('+(l+dx)+'px,'+(t+dy)+'px) scale('+s+')'}
['resize','scroll','focusin','focusout'].forEach(e=>addEventListener(e,()=>{window.scrollTo(0,0);layout();setTimeout(layout,120);setTimeout(layout,450)}));
if(window.visualViewport){visualViewport.addEventListener('resize',layout);visualViewport.addEventListener('scroll',layout)}
layout();
/* ---- TV screen views ---- */
const scr=$('#scr'),T={movies:'My Movies',favs:'Favorites',recent:'Recently Watched',search:'Search'};
const EM={movies:'No movies yet. Enter a disc code to add one.',favs:'No favorites yet. Tap the heart on a movie.',recent:'Nothing watched yet.',search:'No movies match.'};
function setNote(t,b){note=t;bad=!!b;const e=$('#tn');if(e){e.textContent=t||'Enter a disc code on the player';e.className='nt'+(b?' bad':'')}}
function home(){view='home';arm=false;scr.innerHTML='<div class="c"><div class="osd big">DingCD</div><p class="nt'+(bad?' bad':'')+'" id="tn">'+esc(note||'Enter a disc code on the player')+'</p><p class="bl">&#9654;</p></div>'}
const hd=t=>'<div class="hd"><button class="bk" data-a="back">&#9664;</button><span class="osd">'+t+'</span></div>';
function menu(){view='menu';scr.innerHTML=hd('SETTINGS')+'<div class="ls">'+Object.keys(T).map(k=>'<button class="mi" data-go="'+k+'">'+T[k]+'</button>').join('')+
 '<button class="mi" data-a="snd">Sound: '+(S.snd?'ON':'OFF')+'</button><button class="mi" data-a="rst">'+(arm?'Tap again to confirm reset':'Reset my movies')+'</button></div>'}
function info(){view='info';arm=false;scr.innerHTML=hd('INFO')+'<div class="ls"><p class="inf">Dingboy CD player, vibecoded with Claude, and watch our movies in a... better and fun way!</p></div>'}
function list(m){view='list';arm=false;lm=m;scr.innerHTML=hd(T[m])+(m==='search'?'<input id="q" placeholder="Search your movies" autocomplete="off" spellcheck="false">':'')+'<div class="ls" id="ls"></div>';
 if(m==='search')$('#q').addEventListener('input',fill);fill()}
function fill(){const o=MOVIES.filter(x=>S.un.includes(x.id));let l;
 if(lm==='movies')l=o;else if(lm==='favs')l=o.filter(x=>S.fv.includes(x.id));else if(lm==='recent')l=S.rc.map(byId).filter(x=>x&&S.un.includes(x.id));
 else{const q=$('#q').value.trim().toLowerCase();l=q?o.filter(x=>(x.title+' '+x.desc).toLowerCase().includes(q)):o}
 $('#ls').innerHTML=l.length?l.map(x=>'<div class="rw" data-id="'+esc(x.id)+'"><div class="th" style="background-image:url(\''+esc(thumb(x))+'\')"></div><div class="tx"><b>'+esc(x.title)+'</b><span>'+esc(x.desc)+'</span></div><button class="fv'+(S.fv.includes(x.id)?' on':'')+'" data-fav="'+esc(x.id)+'">&#9829;</button></div>').join(''):'<p class="em">'+EM[lm]+'</p>'}
function tf(id){S.fv=S.fv.includes(id)?S.fv.filter(x=>x!==id):S.fv.concat(id);sv('dc_favs',S.fv)}
scr.addEventListener('click',e=>{const t=e.target;let n;
 if(n=t.closest('[data-fav]')){tf(n.dataset.fav);fill();return}
 if(n=t.closest('[data-go]')){list(n.dataset.go);return}
 if(n=t.closest('[data-a]')){const a=n.dataset.a;
  if(a==='back')view==='list'?menu():home();
  else if(a==='snd'){S.snd=!S.snd;try{localStorage.setItem('dc_sound',S.snd?'1':'0')}catch(x){}menu()}
  else if(a==='rst'){if(!arm)arm=true;else{S.un=[];S.fv=[];S.rc=[];sv('dc_unlocked',[]);sv('dc_favs',[]);sv('dc_recent',[]);arm=false}menu()}
  return}
 if(n=t.closest('.rw')){const m=byId(n.dataset.id);if(m&&!busy){busy=true;zoom(()=>play(m))}}});
$('#bGear').onclick=()=>{if(!busy)view==='menu'?home():menu()};$('#bInfo').onclick=()=>{if(!busy)view==='info'?home():info()};
/* ---- tray + code entry ---- */
const tray=$('#tray'),inp=$('#code'),trayOut=o=>tray.classList.toggle('out',o);
inp.addEventListener('focus',()=>{if(!busy)trayOut(true)});inp.addEventListener('input',()=>{if(!busy)trayOut(true);if(bad)setNote('')});
inp.addEventListener('blur',()=>{if(!busy&&!inp.value)trayOut(false)});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}});$('#go').onclick=submit;
function submit(){if(busy)return;const c=norm(inp.value);if(view!=='home')home();
 if(!c){setNote('Type a disc code first.',1);return}
 const m=MOVIES.find(x=>norm(x.code)===c);
 if(!m){setNote('No disc found for that code.',1);const u=$('#lab');u.classList.remove('shake');void u.offsetWidth;u.classList.add('shake');inp.blur();setTimeout(()=>trayOut(false),500);return}
 inp.blur();inp.value='';busy=true;let add=false;
 if(!m.secret&&!S.un.includes(m.id)){S.un.push(m.id);sv('dc_unlocked',S.un);add=true}
 const d=$('#disc');d.style.backgroundImage='url("'+thumb(m)+'")';d.classList.add('show');trayOut(true);setNote(add?m.title+' added to My Movies.':'');
 setTimeout(()=>{trayOut(false);setNote('Loading disc...');sound(()=>zoom(()=>play(m)))},900)}
function sound(next){let done=false;const fin=()=>{if(done)return;done=true;next()};
 if(!S.snd){setTimeout(fin,3500);return}
 const a=new Audio(sfx||'cd.mp3');a.onended=fin;a.onerror=()=>setTimeout(fin,3000);const p=a.play();if(p&&p.catch)p.catch(()=>setTimeout(fin,3000));setTimeout(fin,16000)}
/* zoom into the TV screen, then the video starts */
function zoom(cb){const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight,s=Math.max(w/318,h/236)*1.04;
 stage.style.transition='transform 1.7s cubic-bezier(.6,0,.3,1)';
 stage.style.transform='translate('+(w/2-615*s)+'px,'+(h/2-549*s)+'px) scale('+s+')';
 setTimeout(()=>{cb();setTimeout(()=>{$('#disc').classList.remove('show');busy=false;layout();if(view==='home')setNote('')},500)},1800)}
/* ---- code book ---- */
function openBook(){const p=MOVIES.filter(x=>!x.secret);
 $('#pg').innerHTML=p.length?p.map(x=>'<button class="cr" data-c="'+esc(x.code)+'">'+esc(x.title)+'<i>'+esc(x.code)+'</i></button>').join(''):'<p style="font-size:12px">No discs listed yet.</p>';
 $('#bk').classList.add('on');setTimeout(()=>$('#book').classList.add('open'),80)}
function closeBook(){$('#book').classList.remove('open');setTimeout(()=>$('#bk').classList.remove('on'),950)}
$('#bFilm').onclick=()=>{if(!busy)openBook()};
$('#bk').addEventListener('click',e=>{const c=e.target.closest('.cr');if(c){inp.value=c.dataset.c;trayOut(true);closeBook();return}if(!e.target.closest('#book'))closeBook()});
/* ---- player ---- */
function ensureYT(ok,fail){if(window.YT&&YT.Player)return ok();ytq.push(ok);if(ytS)return;ytS=1;window.onYouTubeIframeAPIReady=()=>ytq.splice(0).forEach(f=>f());
 const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytS=0;ytq.length=0;fail()};document.head.appendChild(s)}
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function showErr(t){$('#perrT').textContent=t;$('#perr').classList.add('on')}
function ctl(auto){const p=$('#player');p.classList.remove('hide');clearTimeout(hideT);if(auto)hideT=setTimeout(()=>{if(!drag)p.classList.add('hide')},3500)}
function updFav(){$('#pFav').style.color=cur&&S.fv.includes(cur.id)?'var(--mag)':'var(--ink)'}
function play(m){cur=m;$('#pTitle').textContent=m.title;$('#pFav').style.display=m.secret?'none':'';updFav();
 $('#end').classList.remove('on');$('#perr').classList.remove('on');$('#player').classList.add('on');orient('land');
 if(!m.secret){S.rc=[m.id].concat(S.rc.filter(x=>x!==m.id)).slice(0,20);sv('dc_recent',S.rc)}ctl(true);
 ensureYT(()=>{if(player){try{player.destroy()}catch(e){}player=null}$('#ytw').innerHTML='<div id="yt"></div>';
  player=new YT.Player('yt',{videoId:m.yt,playerVars:{autoplay:1,controls:0,rel:0,playsinline:1,modestbranding:1,fs:0,iv_load_policy:3,disablekb:1},events:{
   onReady:e=>e.target.playVideo(),
   onStateChange:e=>{$('#pPlay').innerHTML=e.data===1?'&#10074;&#10074;':'&#9654;';if(e.data===0){$('#end').classList.add('on');ctl(false)}},
   onError:e=>showErr("This video can't be played (error "+e.data+").")}});
  clearInterval(poll);poll=setInterval(()=>{if(!player||!player.getCurrentTime)return;const t=player.getCurrentTime(),d=player.getDuration();
   $('#tm').textContent=fmt(t)+' / '+fmt(d);if(!drag&&d)$('#seek').value=Math.round(t/d*1000)},300)},
 ()=>showErr("Can't reach YouTube. Check your internet connection."))}
function closePlayer(){clearInterval(poll);clearTimeout(hideT);if(player){try{player.destroy()}catch(e){}player=null}
 $('#ytw').innerHTML='<div id="yt"></div>';$('#player').classList.remove('on');$('#end').classList.remove('on');$('#perr').classList.remove('on');
 $('#seek').value=0;$('#tm').textContent='0:00 / 0:00';cur=null;orient('port');if(view==='list')fill();setTimeout(layout,300)}
$('#tap').onclick=()=>{$('#player').classList.contains('hide')?ctl(true):$('#player').classList.add('hide')};
$('#pBack').onclick=$('#eBack').onclick=$('#eBack2').onclick=closePlayer;
$('#pPlay').onclick=()=>{if(!player)return;ctl(true);player.getPlayerState()===1?player.pauseVideo():player.playVideo()};
$('#eRep').onclick=()=>{$('#end').classList.remove('on');if(player){player.seekTo(0,true);player.playVideo()}ctl(true)};
$('#seek').addEventListener('input',()=>{drag=true;ctl(false)});
$('#seek').addEventListener('change',e=>{if(player)player.seekTo(e.target.value/1000*player.getDuration(),true);drag=false;ctl(true)});
$('#pFav').onclick=()=>{if(cur){tf(cur.id);updFav();ctl(true)}};
window.dingBack=()=>{if($('#player').classList.contains('on')){closePlayer();return true}
 if($('#bk').classList.contains('on')){closeBook();return true}if(busy)return true;
 if(view==='list'){menu();return true}if(view!=='home'){home();return true}return false};
/* ---- movie list: online file (movies.json on GitHub) with the list above as offline backup ---- */
const MOVIES_URL='https://raw.githubusercontent.com/yoniyat/dingcd/main/movies.json';
function useList(d){const ok=Array.isArray(d)?d.filter(x=>x&&x.id&&x.title&&x.yt&&x.code):[];if(!ok.length)return false;MOVIES.length=0;ok.forEach(x=>MOVIES.push(x));return true}
try{useList(JSON.parse(localStorage.getItem('dc_movies')))}catch(e){}
fetch(MOVIES_URL+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(useList(d)){try{localStorage.setItem('dc_movies',JSON.stringify(d))}catch(e){}if(view==='list')fill()}}).catch(()=>{});
home();
</script></body></html>
